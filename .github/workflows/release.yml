name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version override (e.g. 2.0.0). Leave empty to auto-detect'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages:
            git curl
            llvm clang clang-tools clang-tidy
            cmake ninja-build pkg-config
            libvulkan-dev
            mesa-common-dev
            qt6-base-dev qt6-base-dev-tools
            qt6-tools-dev qt6-tools-dev-tools
            qt6-declarative-dev qt6-declarative-dev-tools
          version: 2.0

      - name: Update Vulkan headers
        run: |
          git clone -b vulkan-sdk-1.4.328 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vkh
          sudo rm -rf /usr/include/{vulkan,vk_video}
          sudo mv /tmp/vkh/include/{vulkan,vk_video} /usr/include/
          rm -rf /tmp/vkh

      - name: Detect version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
              VER="${{ github.event.inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VER="${{ github.ref_name }}"
              VER="${VER#v}"
          else
              VER="2.0.0-dev${{ github.run_number }}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER"

      - name: Configure lsfg-vk
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=./target \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLSFGVK_BUILD_VK_LAYER=ON \
            -DLSFGVK_BUILD_UI=ON \
            -DLSFGVK_BUILD_CLI=ON \
            -DLSFGVK_INSTALL_XDG_FILES=ON \
            -DLSFGVK_LAYER_LIBRARY_PATH="../../../lib/liblsfg-vk-layer.so"

      - name: Build with Ninja
        run: ninja -C build

      - name: Install with CMake
        run: cmake --install build

      - name: Package artifacts
        run: |
          mkdir -p artifact
          cp -r target/. artifact/
          tar -cJf "lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz" -C target .
          sha256sum "lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz" \
            > "lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: lsfg-vk v${{ steps.version.outputs.VERSION }}
          body: |
            ## lsfg-vk v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download `lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz`
            2. Extract into `~/.local`:
               ```bash
               tar -xvf lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz -C ~/.local
               ```
            3. Ensure Lossless Scaling is installed via Steam
            4. Launch `lsfg-vk-ui` to configure profiles
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz
            lsfg-vk-${{ steps.version.outputs.VERSION }}-x86_64.tar.xz.sha256
          generate_release_notes: true
